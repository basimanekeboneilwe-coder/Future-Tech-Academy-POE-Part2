<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Future Tech Academy | Enquiry</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <nav>
        <h2>Future Tech Academy</h2>

        <ul class="nav-links">
            <li><a href="index.html">Home</a></li>
            <li><a href="about.html">About Us</a></li>
            <li><a href="services.html">Programs</a></li>
            <li><a href="contact.html">Contact</a></li>
        </ul>
    </nav>

    <!-- Main Content -->
    <main class="page main">

        <section class="page-header">
            <h2>Enquiry Form</h2>
            <p>
                Please fill out the form below and our team will get back to you
                as soon as possible.
            </p>
        </section>

        <section class="form-container">

            <form action="#" method="post" class="card-tech tech-form">

                <div class="form-group">
                    <label for="fullname">Full Name</label>
                    <input
                        type="text"
                        id="fullname"
                        name="fullname"
                        placeholder="Enter your full name"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="e.g. parent@example.com"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="phone">Contact Number</label>
                    <input
                        type="tel"
                        id="phone"
                        name="phone"
                        placeholder="e.g. 082 123 4567"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="age">Student Age</label>
                    <input
                        type="number"
                        id="age"
                        name="age"
                        min="8"
                        max="99"
                        placeholder="e.g. 15"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="programme">Select Programme</label>

                    <select id="programme" name="programme" required>
                        <option value="" disabled selected>
                            -- Select a Course --
                        </option>
                        <option value="junior">
                            Junior Coders (Ages 10–14)
                        </option>
                        <option value="webdev">
                            Web Development Fundamentals (Ages 15+)
                        </option>
                        <option value="python">
                            Python & Data Analytics (Ages 16+)
                        </option>
                    </select>
                </div>

                <button type="submit" class="btn-tech">
                    Submit Enquiry
                </button>

            </form>

        </section>

    </main>

    <!-- Footer Section -->
    <footer>
        <p>&copy; 2026 Future Tech Academy. All rights reserved.</p>
    </footer>

</body>
</html>
